<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Mojej Konstancji ❤️</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a55;
            --accent: #ff758c;
            --bg-dark: #0f0c1b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 42, 85, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1f122b 0%, #090514 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f122b, #090514);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.8s ease-in-out;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(255, 42, 85, 0.15);
        }

        .lock-box h2 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .lock-box input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .lock-box button {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 20px rgba(255, 42, 85, 0.4);
            transition: all 0.3s;
        }

        .error-text {
            color: #ff4d6d;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
            font-weight: 600;
        }

        #main-content {
            display: none;
            width: 100%;
            max-width: 550px;
            z-index: 5;
            opacity: 0;
            transition: opacity 1.2s ease;
            padding: 20px 0;
        }

        h1 {
            font-family: 'Caveat', cursive;
            color: #fff;
            font-size: 3.2rem;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--accent);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 35px;
            opacity: 0;
            transform: translateY(40px);
        }

        .show-card {
            animation: customFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes customFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nowoczesne świecące kafelki z napisami */
        .neon-row {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .neon-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary);
            border-radius: 2px 0 0 2px;
        }

        .neon-row:hover {
            transform: scale(1.03) translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(255, 42, 85, 0.25);
            background: rgba(255, 42, 85, 0.04);
        }

        .neon-row:last-child { margin-bottom: 0; }

        .row-icon {
            font-size: 2.3rem;
            filter: drop-shadow(0 0 6px var(--primary));
        }

        .row-text {
            display: flex;
            flex-direction: column;
        }

        .row-text .label {
            font-size: 0.8rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .row-text .val {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Odtwarzacz muzyczny */
        .music-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(255,42,85,0.12) 0%, rgba(0,0,0,0.45) 100%);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 25px rgba(255,42,85,0.15);
        }

        .music-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .music-info p {
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 3px;
            font-weight: 600;
        }

        .play-circle {
            width: 55px;
            height: 55px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary);
            transition: all 0.3s ease;
        }

        .play-circle:hover {
            transform: scale(1.1);
            background: var(--primary);
        }

        .play-icon-shape {
            font-size: 1.6rem;
            color: var(--bg-dark);
            margin-left: 4px;
            user-select: none;
        }

        .play-circle:hover .play-icon-shape {
            color: #fff;
        }

        /* List miłosny */
        .letter-content {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            line-height: 1.6;
            text-align: center;
            color: #f7fafc;
            letter-spacing: 0.5px;
        }

        .signature {
            font-family: 'Caveat', cursive;
            font-size: 2.4rem;
            margin-top: 25px;
            color: var(--accent);
            text-align: center;
            text-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <!-- Animowane tło ze SPADAJĄCYMI serduszekami -->
    <canvas id="canvas-bg"></canvas>

    <!-- KROK 1: Ekran blokady -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>Wprowadź tajny kod związku:</h2>
            <input type="password" id="pass" placeholder="••••••" maxlength="6">
            <button onclick="check()">Otwórz serce</button>
            <div id="err" class="error-text">Niepoprawny kod! Spróbuj jeszcze raz ❤️</div>
        </div>
    </div>

    <!-- KROK 2: Panel Główny -->
    <div id="main-content">
        
        <div class="card" id="card1">
            <h1>Nasze Urodziny</h1>
            <div class="neon-row">
                <div class="row-icon">👦</div>
                <div class="row-text">
                    <span class="label">Moje Urodziny</span>
                    <span class="val">17 Listopada 2008 r.</span>
                </div>
            </div>
            <div class="neon-row">
                <div class="row-icon">👧</div>
                <div class="row-text">
                    <span class="label">Urodziny Konstancji</span>
                    <span class="val">26 Sierpnia 2009 r.</span>
                </div>
            </div>
        </div>

        <div class="card" id="card2">
            <h1>Ważne Daty</h1>
            <div class="neon-row">
                <div class="row-icon">⚡</div>
                <div class="row-text">
                    <span class="label">Dzień, w którym się poznaliśmy</span>
                    <span class="val">26 Lipca 2025 r.</span>
                </div>
            </div>
            <div class="neon-row">
                <div class="row-icon">🔥</div>
                <div class="row-text">
                    <span class="label">Oficjalnie razem od</span>
                    <span class="val">14 Listopada 2025 r.</span>
                </div>
